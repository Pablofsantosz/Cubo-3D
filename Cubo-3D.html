<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cubo Mágico 3D </title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; overflow: hidden; }
    canvas { display: block; }
    #info {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      font-size: 15px;
      background: rgba(0, 0, 0, 0.6);
      padding: 8px 20px;
      border-radius: 8px;
      text-align: center;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="info">Pilares do Three.js e 1 Cubo Simples</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // pilar1; SCENE (Onde tudo existe) 
    const scene = new THREE.Scene();

    // pilar2; CAMERA (Como enxergamos a cena) 
    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(4, 4, 8); 
    camera.lookAt(0, 0, 0);       

    // pilar3; RENDERER (Desenha a tela) 
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setClearColor(0x111111);
    document.body.appendChild(renderer.domElement);

    //Iluminação da cena
    const luzAmbiente = new THREE.AmbientLight(0xffffff, 0.6); 
    scene.add(luzAmbiente);

    
    //  cubo basico (Geometry + Material = Mesh)
    
    const cuboMagico = new THREE.Group(); 
    scene.add(cuboMagico);

    // Diminuição do tamanho para ver a diff entre os cubos
    const geometria = new THREE.BoxGeometry(0.95, 0.95, 0.95);
    //const material = new THREE.MeshBasicMaterial({ color: 0x00ffcc, wireframe: true });
    
    // Coloração dos cubinhos
    var colours = [
      0xC41E3A, // Vermelho
      0x009E60, // Verde
      0x0051BA, // Azul
      0xFF5800, // Laranja
      0xFFD500, // Amarelo
      0xFFFFFF  // Branco
    ];
    
    
    var cubeMaterials = colours.map(function(c) {
      return new THREE.MeshLambertMaterial({ color: c });
    });

    //  grid 3x3x3
    for (let x = -1; x <= 1; x++) {
      for (let y = -1; y <= 1; y++) {
        for (let z = -1; z <= 1; z++) {
          const peca = new THREE.Mesh(geometria, cubeMaterials);
          const espacamento = 1.05
          peca.position.set(x * espacamento, y* espacamento, z* espacamento);
          cuboMagico.add(peca); 
        }
      }
    }

    let alfa = 0;
    let beta = 0;

    

    document.addEventListener('keydown', (e) => {
      switch (e.key) {
        case 'ArrowRight': beta  -= 3; break;
        case 'ArrowLeft':  beta  += 3; break;
        case 'ArrowUp':    alfa  -= 3; break;
        case 'ArrowDown':  alfa  += 3; break;
      }
    });

    const toRad = THREE.MathUtils.degToRad;

    
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    
    //Loop cubo girando 
  
    function animate() {
      requestAnimationFrame(animate);

      //Rotação contínua 
      
      cuboMagico.rotation.x = toRad(alfa);
      cuboMagico.rotation.y = toRad(beta);

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
