<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cubo Mágico 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #111; overflow: hidden; }
    canvas { display: block; }
    #info {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      font-size: 15px;
      background: rgba(0, 0, 0, 0.6);
      padding: 8px 20px;
      border-radius: 8px;
      text-align: center;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="info">Cubo Mágico 3D - Clique nas fatias para girar</div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  
  <script>
    let scene, camera, renderer, controls;
    let cuboMagico;
    let raycaster, mouse;
    let isMoving = false;

    init();
    animate();

    function init() {
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(4, 4, 8);
      camera.lookAt(0, 0, 0);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setClearColor(0x111111);
      document.body.appendChild(renderer.domElement);

      const luzAmbiente = new THREE.AmbientLight(0xffffff, 0.8);
      scene.add(luzAmbiente);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;

      raycaster = new THREE.Raycaster();
      mouse = new THREE.Vector2();

      criarCuboMagico();

      window.addEventListener('resize', onWindowResize);
      window.addEventListener('click', onCubeClick);
    }

    function criarCuboMagico() {
      cuboMagico = new THREE.Group();
      scene.add(cuboMagico);

      const geometria = new THREE.BoxGeometry(0.95, 0.95, 0.95);
      const espacamento = 1.05;

      const matPreto = new THREE.MeshLambertMaterial({ color: 0x000000 });

      const matDireita  = new THREE.MeshLambertMaterial({ color: 0xC41E3A }); 
      const matEsquerda = new THREE.MeshLambertMaterial({ color: 0xFF5800 }); 
      const matCima     = new THREE.MeshLambertMaterial({ color: 0xFFFFFF }); 
      const matBaixo    = new THREE.MeshLambertMaterial({ color: 0xFFD500 }); 
      const matFrente   = new THREE.MeshLambertMaterial({ color: 0x009E60 }); 
      const matTras     = new THREE.MeshLambertMaterial({ color: 0x0051BA }); 

      for (let x = -1; x <= 1; x++) {
        for (let y = -1; y <= 1; y++) {
          for (let z = -1; z <= 1; z++) {
            
            const materiaisPeca = [
              x === 1 ? matDireita : matPreto,
              x === -1 ? matEsquerda : matPreto,
              y === 1 ? matCima : matPreto,
              y === -1 ? matBaixo : matPreto,
              z === 1 ? matFrente : matPreto,
              z === -1 ? matTras : matPreto
            ];

            const peca = new THREE.Mesh(geometria, materiaisPeca);
            peca.position.set(x * espacamento, y * espacamento, z * espacamento);
            cuboMagico.add(peca);
          }
        }
      }
    }

    function onCubeClick(event) {
      if (isMoving) return;

      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(cuboMagico.children);

      if (intersects.length > 0) {
        const targetPiece = intersects[0].object;
        const normal = intersects[0].face.normal; 

        let axis = 'y'; 
        if (Math.abs(normal.x) > 0.9) axis = 'x';
        if (Math.abs(normal.z) > 0.9) axis = 'z';

        rotateSlice(axis, targetPiece.position[axis]);
      }
    }

    function rotateSlice(axis, layerValue) {
      isMoving = true;
      const tempGroup = new THREE.Group();
      scene.add(tempGroup);

      const targetLayer = Math.round(layerValue * 100) / 100;

      const piecesToRotate = [];
      cuboMagico.children.forEach(peca => {
        const currentPos = Math.round(peca.position[axis] * 100) / 100;
        if (currentPos === targetLayer) {
          piecesToRotate.push(peca);
        }
      });

      piecesToRotate.forEach(peca => {
        tempGroup.attach(peca);
      });

      let currentRotation = 0;
      const targetRotation = Math.PI / 2;
      const step = 0.08;

      function animateSlice() {
        if (currentRotation < targetRotation) {
          tempGroup.rotation[axis] += step;
          currentRotation += step;
          requestAnimationFrame(animateSlice);
        } else {
          tempGroup.rotation[axis] = targetRotation;

          const finishedPieces = [...tempGroup.children];
          finishedPieces.forEach(peca => {
            cuboMagico.attach(peca);
          });

          scene.remove(tempGroup);
          isMoving = false;
        }
      }

      animateSlice();
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
